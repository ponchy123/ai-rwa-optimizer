<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: #0a0a1a; color: white; width: 1920px; height: 1080px; }
.header { background: #111; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
.logo { font-size: 24px; font-weight: bold; color: #667eea; }
.nav { display: flex; gap: 20px; }
.nav-item { padding: 8px 16px; border-radius: 8px; cursor: pointer; }
.nav-item.active { background: #667eea; }
.wallet { background: #667eea; padding: 8px 20px; border-radius: 8px; }
.main { padding: 40px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
.stat-card { background: #1a1a2e; border-radius: 12px; padding: 24px; text-align: center; }
.stat-value { font-size: 32px; font-weight: bold; color: #667eea; }
.stat-label { color: #888; margin-top: 8px; }
.content { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.card { background: #1a1a2e; border-radius: 12px; padding: 24px; }
.card-title { font-size: 18px; font-weight: bold; margin-bottom: 16px; }
.asset-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #333; }
.asset-name { color: #667eea; }
.ai-suggestion { background: #1a1a3e; border-left: 4px solid #667eea; padding: 16px; margin-bottom: 12px; border-radius: 0 8px 8px 0; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">AI-RWA Optimizer</div>
  <div class="nav">
    <div class="nav-item active">仪表盘</div>
    <div class="nav-item">投资组合</div>
    <div class="nav-item">AI策略</div>
    <div class="nav-item">自动支付</div>
  </div>
  <div class="wallet">0x1234...5678</div>
</div>
<div class="main">
  <div class="stats">
    <div class="stat-card"><div class="stat-value">$125,000</div><div class="stat-label">总投资价值</div></div>
    <div class="stat-card"><div class="stat-value">+2.35%</div><div class="stat-label">24小时收益</div></div>
    <div class="stat-card"><div class="stat-value">+5.67%</div><div class="stat-label">7天收益</div></div>
    <div class="stat-card"><div class="stat-value">87%</div><div class="stat-label">AI置信度</div></div>
  </div>
  <div class="content">
    <div class="card">
      <div class="card-title">资产配置</div>
      <div class="asset-item"><span>xAU 代币化黄金</span><span>40% | $50,000</span></div>
      <div class="asset-item"><span>xRE 代币化房地产</span><span>30% | $37,500</span></div>
      <div class="asset-item"><span>xST 代币化股票</span><span>20% | $25,000</span></div>
      <div class="asset-item"><span>USDT 稳定币</span><span>10% | $12,500</span></div>
    </div>
    <div class="card">
      <div class="card-title">AI建议</div>
      <div class="ai-suggestion"><strong>增加稳定币配置</strong><br>建议从10%提高到15%</div>
      <div class="ai-suggestion"><strong>优化再平衡频率</strong><br>当前波动性较高</div>
      <div class="ai-suggestion"><strong>新增债券资产</strong><br>分散风险</div>
    </div>
  </div>
</div>
</body>
</html>
