<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: #0a0a1a; color: white; width: 1920px; height: 1080px; }
.header { background: #111; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
.logo { font-size: 24px; font-weight: bold; color: #667eea; }
.nav { display: flex; gap: 20px; }
.nav-item { padding: 8px 16px; border-radius: 8px; }
.nav-item.active { background: #667eea; }
.wallet { background: #667eea; padding: 8px 20px; border-radius: 8px; }
.main { padding: 40px; }
h2 { font-size: 28px; margin-bottom: 24px; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 16px; text-align: left; border-bottom: 1px solid #333; }
.table th { color: #888; font-weight: normal; }
.btn { background: #667eea; padding: 10px 24px; border: none; border-radius: 8px; color: white; cursor: pointer; }
.form { background: #1a1a2e; border-radius: 12px; padding: 24px; margin-top: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; color: #888; margin-bottom: 8px; }
.form-group input { width: 100%; padding: 12px; background: #0a0a1a; border: 1px solid #333; border-radius: 8px; color: white; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">AI-RWA Optimizer</div>
  <div class="nav">
    <div class="nav-item">仪表盘</div>
    <div class="nav-item active">投资组合</div>
    <div class="nav-item">AI策略</div>
    <div class="nav-item">自动支付</div>
  </div>
  <div class="wallet">0x1234...5678</div>
</div>
<div class="main">
  <h2>投资组合管理</h2>
  <table class="table">
    <tr><th>资产</th><th>余额</th><th>价值</th><th>占比</th><th>操作</th></tr>
    <tr><td>xAU 代币化黄金</td><td>5.2</td><td>$50,000</td><td>40%</td><td><button class="btn">移除</button></td></tr>
    <tr><td>xRE 代币化房地产</td><td>125</td><td>$37,500</td><td>30%</td><td><button class="btn">移除</button></td></tr>
    <tr><td>xST 代币化股票</td><td>500</td><td>$25,000</td><td>20%</td><td><button class="btn">移除</button></td></tr>
    <tr><td>USDT 稳定币</td><td>12,500</td><td>$12,500</td><td>10%</td><td><button class="btn">移除</button></td></tr>
  </table>
  <div class="form">
    <h3 style="margin-bottom: 16px;">添加新资产</h3>
    <div class="form-group"><label>资产合约地址</label><input placeholder="0x..."></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div class="form-group"><label>数量</label><input placeholder="0.00"></div>
      <div class="form-group"><label>目标配置比例 (%)</label><input placeholder="0"></div>
    </div>
    <button class="btn" style="margin-top: 8px;">添加资产</button>
  </div>
</div>
</body>
</html>
