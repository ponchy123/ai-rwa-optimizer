<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: #0a0a1a; color: white; width: 1920px; height: 1080px; }
.header { background: #111; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
.logo { font-size: 24px; font-weight: bold; color: #667eea; }
.nav { display: flex; gap: 20px; }
.nav-item { padding: 8px 16px; border-radius: 8px; }
.nav-item.active { background: #667eea; }
.wallet { background: #667eea; padding: 8px 20px; border-radius: 8px; }
.main { padding: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
h2 { font-size: 28px; margin-bottom: 24px; }
.card { background: #1a1a2e; border-radius: 12px; padding: 24px; }
.slider { width: 100%; height: 8px; background: #333; border-radius: 4px; margin: 16px 0; position: relative; }
.slider-fill { width: 50%; height: 100%; background: #667eea; border-radius: 4px; }
.slider-labels { display: flex; justify-content: space-between; color: #888; font-size: 14px; }
.result { text-align: center; padding: 20px; }
.result-value { font-size: 48px; font-weight: bold; color: #667eea; }
.result-label { color: #888; margin-top: 8px; }
.btn { background: #667eea; padding: 12px 32px; border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 16px; }
.allocation-bar { height: 40px; display: flex; border-radius: 8px; overflow: hidden; margin: 16px 0; }
.allocation-seg { display: flex; align-items: center; justify-content: center; font-weight: bold; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">AI-RWA Optimizer</div>
  <div class="nav">
    <div class="nav-item">仪表盘</div>
    <div class="nav-item">投资组合</div>
    <div class="nav-item active">AI策略</div>
    <div class="nav-item">自动支付</div>
  </div>
  <div class="wallet">0x1234...5678</div>
</div>
<div class="main">
  <div>
    <div class="card">
      <h2>策略参数设置</h2>
      <div style="margin-bottom: 24px;">
        <label style="color: #888;">风险承受能力</label>
        <div class="slider"><div class="slider-fill"></div></div>
        <div class="slider-labels"><span>保守</span><span>平衡</span><span>激进</span></div>
        <div style="text-align: center; color: #667eea; margin-top: 8px;">平衡 (5/10)</div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
        <div><label style="color: #888;">投资期限（天）</label><input style="width: 100%; padding: 12px; background: #0a0a1a; border: 1px solid #333; border-radius: 8px; color: white; margin-top: 8px;" value="90"></div>
        <div><label style="color: #888;">目标收益率（%）</label><input style="width: 100%; padding: 12px; background: #0a0a1a; border: 1px solid #333; border-radius: 8px; color: white; margin-top: 8px;" value="10"></div>
      </div>
      <button class="btn">生成AI策略</button>
    </div>
  </div>
  <div>
    <div class="card">
      <h2>AI生成策略</h2>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px;">
        <div class="result"><div class="result-value">8.5%</div><div class="result-label">预期年化收益</div></div>
        <div class="result"><div class="result-value">45</div><div class="result-label">风险评分</div></div>
        <div class="result"><div class="result-value">87%</div><div class="result-label">AI置信度</div></div>
      </div>
      <h3 style="margin-bottom: 12px;">建议资产配置</h3>
      <div class="allocation-bar">
        <div class="allocation-seg" style="width: 60%; background: #4caf50;">60% 稳定资产</div>
        <div class="allocation-seg" style="width: 40%; background: #ff9800;">40% 风险资产</div>
      </div>
      <button class="btn" style="width: 100%; margin-top: 16px;">执行此策略</button>
    </div>
  </div>
</div>
</body>
</html>
